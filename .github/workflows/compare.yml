name: Measure A and B
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [a, b]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:${{ matrix.variant }}
        env:
          RESULT_FILE: report/evidence/ci-${{ matrix.variant }}.json
      - name: Preserve comparison evidence even on failure
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: results-${{ matrix.variant }}
          path: |
            report/evidence/ci-${{ matrix.variant }}.json
            test-results/
